name: Build Website

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # every hours at :00
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '.github/workflows/build.yaml'

permissions:
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Make data directory
        run: mkdir -p src/data/

      - name: Download milestones artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          name: milestones
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: milestones.yaml
          path: src/data/milestones/

      - name: Download qa-road-network artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          name: road-network-data
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow_search: true
          repo: osm-bg/qa-road-network
          path: src/data/

      - name: Download qa-atp-osm artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          name: brand-data
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow_search: true
          repo: osm-bg/qa-atp-osm
          path: src/data/atp-osm

      - name: Download qa-waste-containers artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          name: waste-containers-data
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow_search: true
          repo: osm-bg/qa-waste-containers
          path: src/routes/qa/waste-containers

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build-github

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
